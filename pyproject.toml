[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=64", "setuptools-scm>=8" ]

[project]
name = "meerqat"
version = "0.0.1"
description = "Validate bioimaging datasets by detecting missing files, metadata gaps, and structural inconsistencies early."
readme = "README.md"
authors = [
  { name = "Dave Bunten" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.115",
  "huggingface-hub>=0.30.2",
  "instructor>=1.7.9",
  "langchain-community>=0.3.21",
  "langchain-core>=0.3.49",
  "llama-cpp-python>=0.3.8",
  "openai>=1.72",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "pydantic>=2.11.3",
  "pydantic-settings>=2.8",
  "pyyaml>=6.0.2",
  "sse-starlette>=2.1",
  "starlette-context>=0.3.6",
  "uvicorn>=0.34",
]
scripts.meerqat = "meerqat.cli:main"

[dependency-groups]
dev = [
  "poethepoet>=0.34",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
]
docs = [
  "myst-nb>=1.2",
  "pydata-sphinx-theme>=0.16.1",
  "sphinx>=8.2.3",
]
notebooks = [
  "black>=25.1",
  "isort>=6.0.1",
  "jupyterlab>=4.4.2",
  "jupyterlab-code-formatter>=3.0.2",
  "jupytext>=1.17.1",
]

[tool.setuptools_scm]
root = "."
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
version_file = "src/meerqat/_version.py"

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `F401` (unused imports) for `__init__.py` file
lint.per-file-ignores."__init__.py" = [ "F401" ]

[tool.pytest]
ini_options.pythonpath = [ "." ]
ini_options.addopts = "--cov=meerqat --cov-report=term-missing"
ini_options.markers = [ "integration: exercises the real local llama.cpp runtime" ]

[tool.jupytext]
formats = "ipynb,py:light"

[tool.vulture]
min_confidence = 90
paths = [ "src/meerqat", "tests" ]

[tool.poe]
# tasks for development environments
tasks.test.shell = """
pytest
"""
tasks.jupyter.shell = """
jupyter lab
"""
