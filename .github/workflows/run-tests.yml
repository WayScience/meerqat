---
# used for running tests
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre_commit_checks:
    runs-on: ubuntu-24.04
    steps:
      # checks out the repo
      - uses: actions/checkout@v7
      # run pre-commit
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      - uses: pre-commit/action@v3.0.1
      # run pre-commit ci lite for automated fixes
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: ${{ !cancelled() }}
  run_tests:
    strategy:
      matrix:
        python_version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      - name: Run pytest
        run: uv run --frozen pytest
  llama_cpp_integration:
    runs-on: ubuntu-24.04
    env:
      HF_HOME: ~/.cache/huggingface
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-meerqat-hf-${{ hashFiles('pyproject.toml', 'src/meerqat/config.py') }}
      - name: Prefetch tinyllama runtime model
        run: >-
          uv run --frozen python -c
          "from meerqat.config import LLMConfig;
          from meerqat.llm import get_cached_model_path;
          print(get_cached_model_path(LLMConfig(model_alias='tinyllama').resolved_model()))"
      - name: Run llama.cpp integration test
        run: uv run --frozen pytest tests/test_llm_runtime.py -m integration
